name: Build and Release EPUBs

# Three modes (computed into MODE below):
#   release — stable v* tag push: full release + gh-pages/OPDS publish
#   rc      — v*-rc* tag push: PRE-release rehearsal (never captures
#             releases/latest), no gh-pages; same release text, and the
#             notes may still be marked DRAFT
#   test    — manual workflow_dispatch: build+validate+catalog, results as a
#             workflow artifact; optionally refreshes the rolling
#             `test-build` pre-release (publish_test input)
#
# Which books (computed into ROSTER below): a tag build (release, rc)
# builds and publishes the release set, the books listed in
# release_set.txt. A manual run builds every config, as it always did,
# unless its `roster` input asks for the release set.
#
# What a tag build attaches to the release: the books, the word dictionary
# (the one zip release/quran_qpc_en_stardict_v*.zip), catalog.json and
# renamed-files.csv.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      roster:
        description: 'Books to build: all = every config; release = only release_set.txt, as a tag build does (with publish_test, the test channel then shrinks to that set)'
        type: choice
        options:
          - all
          - release
        default: all
      publish_test:
        description: 'Also refresh the rolling test-build pre-release with the results'
        type: boolean
        default: false
      skip_epubcheck:
        description: 'Skip epubcheck (saves ~95 of ~108 min; test runs only — test-build release body marks assets unvalidated; never on tag builds)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Pinned image, not ubuntu-latest (same reason as drift-check.yml: 26.04
    # dropped libgdk-pixbuf2.0-dev). A release build should not change its OS
    # under us; bump deliberately after a dispatch run on the new image.
    runs-on: ubuntu-24.04
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && 'test' || (contains(github.ref_name, '-rc') && 'rc' || 'release') }}
      ROSTER: ${{ (github.event_name == 'workflow_dispatch' && inputs.roster != 'release') && 'all' || 'release' }}

    steps:
      # fetch-depth 0: hatch-vcs derives the package version (stamped into
      # every EPUB's generator meta) from git tags — a shallow tagless
      # checkout silently yields a bogus 0.1.dev1 version on dispatch runs.
      # Full history gives: stable tag → clean X.Y.Z · rc tag → X.Y.Zrc1 ·
      # dispatch → honest X.Y.Z.devN+g<sha> that self-identifies as a test.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release set: fail in seconds on a path that does not exist, a
      # duplicate, or a book of v0.10.0 that fell out of the set (its
      # readers follow releases/latest).
      - name: Check the release set
        run: python3 scripts/check_release_set.py

      # Cap-and-curate guard: GitHub
      # hard-caps a release at 1000 assets — fail in seconds if the roster
      # outgrew the budget, not at asset 1001 after a 40-minute build.
      - name: Check release asset budget
        run: |
          if [ "$ROSTER" = "all" ]; then
            python3 scripts/release_upload.py --preflight-configs configs/
          else
            python3 scripts/release_upload.py --preflight-set release_set.txt
          fi

      # Fail in seconds, not after the build: stale or draft release notes,
      # a picked book that left the release set, or a release text over the
      # length limit kill the job here (gen_release_body.py). A release
      # candidate rehearses the same text; its notes may still say DRAFT.
      - name: Check the release text
        if: env.MODE != 'test'
        run: python3 scripts/gen_release_body.py "${{ github.ref_name }}" ${{ env.MODE == 'rc' && '--rehearsal' || '' }} > /dev/null

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Locked deps = the third pin (data / timestamps / tools): CI and
      # local install the same requirements.lock, so builds are mutually
      # representative and byte-comparable. Refresh is a reviewed event.
      - name: Install dependencies
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      # BOOKS.md is the table of every book that the release text links
      # to. It is committed, so a tag must carry the table of its own set.
      # A release candidate is never "the latest release", so its table
      # links to the candidate's own files (--tag).
      - name: Check BOOKS.md is current
        if: env.MODE != 'test'
        run: python scripts/gen_books_md.py --check ${{ env.MODE == 'rc' && format('--tag {0}', github.ref_name) || '' }}

      # From the moment this release is public, a README link to
      # releases/latest/download/<file> must name one of its files. Not on
      # a release candidate: the README changes over with the release.
      - name: Check the README's download links
        if: env.MODE == 'release'
        run: python scripts/check_readme_links.py

      # Snapshot model: builds run --offline from the pinned data snapshot
      # (manifest committed at data/snapshot_manifest.json, tarball on the
      # rolling `data-snapshot` pre-release). The only external dependency
      # is one hash-verified download — local and CI outputs are
      # byte-comparable, and upstream drift can never ship untested.
      - name: Restore data snapshot from Actions cache
        id: snapshot-cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: data-snapshot-${{ hashFiles('data/snapshot_manifest.json') }}

      - name: Download data snapshot
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download data-snapshot --pattern quran-data-snapshot.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/quran-data-snapshot.tar.gz" .cache
          rm "$RUNNER_TEMP/quran-data-snapshot.tar.gz"

      - name: Verify snapshot against committed manifest
        run: quran-ebook snapshot verify

      # Preflight is now a drift MONITOR, not a build gate: the build is
      # pinned to the snapshot, so a dead upstream endpoint must not block a
      # release — but drift is still surfaced here (and weekly in
      # drift-check.yml).
      - name: Preflight endpoint checks (drift monitor, non-blocking)
        continue-on-error: true
        run: quran-ebook preflight configs/

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jre-headless libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev
          pip install epubcheck

      # Canary gate: three configs end-to-end (build + epubcheck) before
      # committing to the full sweep — one Hafs (standard path), one Warsh
      # (kfgqpc + alignment-table translation), one IndoPak (Nastaleeq font
      # + marker split + 15-line page map + WBW). All three must stay in
      # release_set.txt: the catalog step refuses a built book it does not
      # list.
      - name: Canary builds (Hafs, Warsh, IndoPak)
        run: |
          quran-ebook build --offline configs/bilingual/en_sahih.yaml
          quran-ebook build --offline configs/bilingual/en_sahih_warsh.yaml
          quran-ebook build --offline configs/wbw/en_indopak.yaml
          quran-ebook validate

      # The word dictionary (the zip in release/) is attached to the
      # release. It must answer every Quran word of the books, cut the way
      # KOReader cuts a word. Here on the three canary books, so that an
      # old dictionary stops the run in minutes; after the build on all.
      - name: Check the word dictionary (canary books)
        if: env.MODE != 'test'
        run: python scripts/check_dictionary_coverage.py

      - name: Build the EPUBs
        run: |
          if [ "$ROSTER" = "all" ]; then
            quran-ebook build --offline --all configs/
          else
            quran-ebook build --offline --set release_set.txt
          fi

      # skip_epubcheck = test mode only (tag builds always epubcheck).
      # Skipped-and-published test assets are marked unvalidated in the
      # test-build release body (EPUBCHECK_SKIPPED below). The content-
      # verification pass (surah/ayah counts, covers) always runs.
      - name: Validate EPUBs with epubcheck
        run: quran-ebook validate ${{ (env.MODE == 'test' && inputs.skip_epubcheck) && '--no-epubcheck' || '' }}

      - name: Check the word dictionary (every book)
        if: env.MODE != 'test'
        run: python scripts/check_dictionary_coverage.py

      # catalog.json = the variant manifest (OPDS input, plugin update
      # manifest, machine-readable rename map). Fails if any EPUB is missing,
      # or if output/ holds an EPUB the catalog does not list.
      - name: Generate catalog.json + OPDS feeds
        run: |
          if [ "$ROSTER" = "all" ]; then
            python scripts/gen_catalog.py --require-artifacts
          else
            python scripts/gen_catalog.py --require-artifacts --set release_set.txt
          fi
          python scripts/gen_opds.py

      # The short release text, and the list of old and new file names
      # that it links to (attached to the release as renamed-files.csv).
      - name: Generate release text + renamed-files.csv
        if: env.MODE != 'test'
        run: |
          python scripts/gen_renamed_files.py
          python scripts/gen_release_body.py "${{ github.ref_name }}" ${{ env.MODE == 'rc' && '--rehearsal' || '' }} > release_body.md

      # Release flow since 2026-07-26:
      # create as DRAFT (notes only, no files), pace the asset uploads
      # through release_upload.py (GitHub allows ~500 content calls/hour;
      # the release set fits one window, every config would span two),
      # then flip public
      # atomically — releases/latest never points at a half-populated set,
      # and a re-run after a failure resumes (byte-identical assets skip).
      - name: Create GitHub Release (draft)
        if: env.MODE == 'release'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release_body.md
          generate_release_notes: true

      - name: Upload release assets + publish (paced)
        if: env.MODE == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_upload.py --tag "${{ github.ref_name }}" \
            --publish --make-latest output/*.epub release/quran_qpc_en_stardict_v*.zip \
            output/catalog.json output/renamed-files.csv

      # RC rehearsal: identical asset set, release text and draft flow,
      # marked PRE-release so it never captures releases/latest.
      - name: Create RC pre-release (draft)
        if: env.MODE == 'rc'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: true
          body_path: release_body.md
          generate_release_notes: true

      - name: Upload RC assets + publish (paced)
        if: env.MODE == 'rc'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/release_upload.py --tag "${{ github.ref_name }}" \
            --publish output/*.epub release/quran_qpc_en_stardict_v*.zip \
            output/catalog.json output/renamed-files.csv

      # Dry runs always leave the full asset set as a workflow artifact
      # (downloadable from the run page; needs a GitHub login).
      - name: Upload build artifact
        if: env.MODE == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: epubs-${{ github.run_number }}
          retention-days: 14
          path: |
            output/*.epub
            output/catalog.json
            output/opds/

      - name: Refresh rolling test-build pre-release
        if: env.MODE == 'test' && inputs.publish_test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EPUBCHECK_SKIPPED: ${{ inputs.skip_epubcheck }}
        run: python scripts/publish_test_build.py "${{ github.sha }}"

      # Publish the OPDS catalog + manifest to gh-pages — STABLE RELEASES
      # ONLY (rc/test must never overwrite the live catalog).
      # KOReader OPDS URL: https://zeeyado.github.io/quran-ebook/opds/root.xml
      - name: Assemble gh-pages site
        if: env.MODE == 'release'
        run: |
          mkdir -p site
          cp -r output/opds site/opds
          cp output/catalog.json site/catalog.json

      - name: Publish OPDS to gh-pages
        if: env.MODE == 'release'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
