# IndoPak Nastaleeq Arabic-only, ayah-by-ayah (one ayah per block —
# the plugin-anchor layout; curated set 2026-07-19). Beta per tier rule 7.
book:
  title: "القرآن الکریم"
  language: "ar"

quran:
  script: "text_indopak_nastaleeq"
  source: "quran_api"

font:
