# ayah_popup TWIN of configs/interactive/ar_muyassar.yaml (full-parity rule, owner GO 2026-07-19).
# Arabic text + Tafsir Muyassar in ayah popups (QUL 16) — the
# madrasa-standard concise per-ayah tafsir; arguably the best
# popup fit there is. tafsir-as-text contract (translation slot).
book:
  title: "القرآن الكريم"
  language: "ar"

quran:
  script: "qpc_uthmani_hafs"
  source: "quran_api"

font:
  arabic: "kfgqpc_uthmanic_hafs"

translation:
  resource_id: 16
  source: "qul_tafsir"
  language: "ar"
  name: "Tafsir Muyassar"
  native_name: "التفسير الميسر"
  abbreviation: "muyassar"

layout:
  structure: "ayah_popup"
  show_ayah_numbers: true
  show_bismillah: true

output:
  directory: "output"
