# popup-footnote reader). Al-Mukhtasar is the production tafsir popup
# (owner 2026-07-24); grouped entries share one endnote.
book:
  title: "القرآن الكريم"
  language: "ar"

quran:
  script: "qpc_uthmani_hafs"
  source: "quran_api"

font:
  arabic: "kfgqpc_uthmanic_hafs"

translation:
  resource_id: 95
  language: "en"
  name: "Sayyid Abul Ala Maududi (Tafhim ul-Quran)"
  abbreviation: "maududi"

tafsir:
  resource_id: 171
  source: "qul_tafsir"
  name: "Al-Mukhtasar"
  abbreviation: "mukhtasar"
  language: "en"

layout:
  structure: "bilingual_interactive"
  show_ayah_numbers: true
  show_bismillah: true

output:
  directory: "output"
